# Each [[collectors]] entry enables one collector. `type` selects the
# implementation in rhd.collectors; remaining keys are passed as its options.

[[collectors]]
type = "rosdistro"
repo = "ros/rosdistro"

# Open PRs and issues of other repos. Add an entry per repo to cover more of the ros2 org.
[[collectors]]
type = "github_repo"
repo = "ros2-gbp/ros2-gbp-github-org"

[[collectors]]
type = "jenkins"
label = "ci.ros2.org"
base_url = "https://ci.ros2.org"
user_env = "JENKINS_CI_USER"
token_env = "JENKINS_CI_TOKEN"
group = "nightly"
match = "^nightly_"
# Look back only a couple of days each run; the matrix fills in as hourly runs accumulate.
days = 2
history = 6
classify_console = true
# Failing-test details; build.ros2.org puts test reports behind a bot challenge, so only here.
tests = true
# Only last night's builds are fetched, a few at a time; history builds up run over run.
test_days = 1
max_test_fetches = 20

# The Rci/Lci/Kci/Jci/Hci views are the per-distro ROS CI jobs.
[[collectors]]
type = "jenkins"
label = "build.ros2.org"
base_url = "https://build.ros2.org"
user_env = "JENKINS_BUILD_USER"
token_env = "JENKINS_BUILD_TOKEN"
views = ["Rci", "Lci", "Kci", "Jci", "Hci"]
match = "nightly"
days = 2
history = 6
# Failures diagnosed by hand ("job#number" = reason). build.ros2.org consoles are behind a bot
# challenge, so its infra failures cannot be recognised from the console automatically.
[collectors.infra_builds]
"Rci__nightly-extra-rmw-release_ubuntu_resolute_amd64#186" = "source checkout failed (vcs import)"

# Package build status per distro (repo.ros2.org status pages + Jenkins job colours).
[[collectors]]
type = "repo_status"
distro = "rolling"

[[collectors]]
type = "repo_status"
distro = "lyrical"

[[collectors]]
type = "repo_status"
distro = "kilted"

[[collectors]]
type = "repo_status"
distro = "jazzy"

[[collectors]]
type = "repo_status"
distro = "humble"

# Build queue depth per distro on build.ros2.org (one /queue request per run).
[[collectors]]
type = "build_queue"

# Alert thresholds (all optional; these are the defaults). Alerts show as banners on the page.
[alerts]
rosdistro_days_since_merge_warn = 1.0
rosdistro_days_since_merge_bad = 3.0
nightly_consecutive_failures_warn = 2
nightly_consecutive_failures_bad = 4
